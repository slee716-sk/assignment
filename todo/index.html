<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="함수·조건문·반복문으로 만든 할 일 관리 앱. Python(todo.py)이 브라우저 안에서 그대로 실행됩니다.">
<meta name="color-scheme" content="light dark">
<title>오늘의 할 일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #111111;
    --ink-2: #6E6E6E;
    --ink-3: #B4B4B4;
    --line: #E4E4E4;
    --accent: #FF5A1F;
    --on-accent: #FFFFFF;
    --console-bg: #111111;
    --console-ink: #E8E8E8;
    --console-dim: #8A8A8A;
    --sans: "IBM Plex Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: "IBM Plex Mono", "D2Coding", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111111; --ink: #F2F2F2; --ink-2: #9A9A9A; --ink-3: #5A5A5A; --line: #2A2A2A;
      --accent: #FF6A33; --console-bg: #000000; --console-ink: #E8E8E8; --console-dim: #7A7A7A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111111; --ink: #F2F2F2; --ink-2: #9A9A9A; --ink-3: #5A5A5A; --line: #2A2A2A;
    --accent: #FF6A33; --console-bg: #000000; --console-ink: #E8E8E8; --console-dim: #7A7A7A;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button:disabled { cursor: default; opacity: .4; }

  .page { max-width: 520px; margin: 0 auto; padding: 72px 24px 96px; }

  header { margin-bottom: 40px; }
  .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 10px; }
  h1 { font-size: 34px; font-weight: 700; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 12px; }
  .summary { margin: 0; font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .summary b { color: var(--accent); font-weight: 700; }
  .bar { height: 3px; margin-top: 16px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }

  form { display: flex; gap: 0; border-bottom: 1.5px solid var(--ink); margin-bottom: 8px; }
  form input { flex: 1; min-width: 0; padding: 12px 0; background: none; border: 0; font-size: 17px; }
  form input::placeholder { color: var(--ink-3); }
  form input:focus-visible { outline: none; }
  form:focus-within { border-bottom-color: var(--accent); }
  .add { padding: 0 4px 0 16px; font-weight: 500; font-size: 15px; color: var(--ink); }
  .add:hover:not(:disabled) { color: var(--accent); }

  ul.list { list-style: none; margin: 0; padding: 0; }
  li.item { display: grid; grid-template-columns: 20px 1fr 24px; gap: 14px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
  li.item.new { animation: rise .25s ease-out both; }
  @keyframes rise { from { opacity: .001; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .check { width: 20px; height: 20px; border: 1.5px solid var(--ink); border-radius: 3px; display: grid; place-items: center; transition: background .15s, border-color .15s; }
  .check svg { width: 12px; height: 12px; fill: none; stroke: var(--on-accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .2s ease .05s; }
  .check:hover { border-color: var(--accent); }
  li.done .check { background: var(--accent); border-color: var(--accent); }
  li.done .check svg { stroke-dashoffset: 0; }

  .title { font-size: 17px; overflow-wrap: anywhere; transition: color .15s; }
  li.done .title { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--ink-3); text-decoration-thickness: 1px; }

  .del { width: 24px; height: 24px; color: var(--ink-3); border-radius: 3px; display: grid; place-items: center; transition: color .12s; }
  .del svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .del:hover { color: var(--accent); }

  .empty { padding: 28px 0; color: var(--ink-2); font-size: 15px; border-bottom: 1px solid var(--line); }

  .foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
  .status { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  body[data-state="loading"] .status .dot { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  body[data-state="ready"] .status .dot { background: var(--accent); animation: none; }
  body[data-state="error"] .status { color: var(--accent); }
  body[data-state="error"] .status .dot { background: var(--accent); animation: none; }
  .clear { font-size: 13px; font-weight: 500; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
  .clear:hover:not(:disabled) { color: var(--accent); text-decoration-color: var(--accent); }

  .console { margin-top: 56px; }
  .console h2 { font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 10px; display: flex; justify-content: space-between; gap: 12px; }
  .console h2 small { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 12px; }
  .term { background: var(--console-bg); color: var(--console-ink); font-family: var(--mono); font-size: 13px; line-height: 1.7; padding: 16px 18px; margin: 0; min-height: 96px; overflow-x: auto; white-space: pre; border-radius: 2px; }
  .term .p { color: var(--accent); }
  .term .r { color: var(--console-dim); }
  .term .hint { color: var(--console-dim); }

  @media (max-width: 480px) {
    .page { padding: 48px 20px 80px; }
    h1 { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body data-state="loading">

<div class="page">
  <header>
    <p class="eyebrow">Todo · todo.py</p>
    <h1>오늘의 할 일</h1>
    <p class="summary" id="summary">Python 불러오는 중…</p>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  </header>

  <main>
    <form id="form" autocomplete="off">
      <input id="input" type="text" maxlength="40" placeholder="할 일을 입력하세요" aria-label="할 일 내용" disabled>
      <button class="add" type="submit" id="add" disabled>추가</button>
    </form>

    <ul class="list" id="list" aria-live="polite"></ul>

    <div class="foot">
      <div class="status"><span class="dot"></span><span id="status">Python 불러오는 중…</span></div>
      <button class="clear" type="button" id="clear" disabled>완료한 항목 지우기</button>
    </div>
  </main>

  <section class="console" aria-label="Python 콘솔">
    <h2>Python 콘솔 <small>버튼을 누르면 호출된 함수가 표시됩니다</small></h2>
    <pre class="term" id="console"><span class="hint">아직 호출된 함수가 없습니다.</span></pre>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const els = { summary: $("summary"), bar: $("bar"), form: $("form"), input: $("input"), add: $("add"),
                list: $("list"), status: $("status"), clear: $("clear"), console: $("console") };
  const log = [];
  let todo = null;   // todo.py 모듈

  // ---------- 화면 그리기 (데이터만 받아서 그린다) ----------
  function render({ items, summary, percent }) {
    els.summary.innerHTML = summary.replace(/^(\d+\/\d+)/, "<b>$1</b>");
    els.bar.style.width = percent + "%";
    els.list.replaceChildren();
    if (items.length === 0) {
      const d = document.createElement("li");
      d.className = "empty";
      d.textContent = "할 일이 없습니다. 위에 하나 적어 보세요.";
      els.list.append(d);
    }
    items.forEach((it, i) => {
      const li = document.createElement("li");
      li.className = "item" + (it.done ? " done" : "") + (it.fresh ? " new" : "");
      li.innerHTML = `
        <button class="check" type="button" data-act="done" data-n="${i + 1}" aria-label="${it.done ? "완료함" : "완료하기"}: ${esc(it.title)}" aria-pressed="${it.done}">
          <svg viewBox="0 0 12 12"><path d="M2 6.5l2.6 2.6L10 3.5"/></svg>
        </button>
        <span class="title">${esc(it.title)}</span>
        <button class="del" type="button" data-act="del" data-n="${i + 1}" aria-label="삭제: ${esc(it.title)}">
          <svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg>
        </button>`;
      els.list.append(li);
    });
    els.clear.disabled = !items.some((it) => it.done);
  }
  function logCall(call, result) {
    log.push({ call, result });
    while (log.length > 7) log.shift();
    els.console.innerHTML = log.map(({ call, result }) =>
      `<span class="p">&gt;&gt;&gt;</span> ${esc(call)}\n<span class="r">${esc(typeof result === "string" ? "'" + result.replace(/'/g, "\\'") + "'" : String(result))}</span>`
    ).join("\n");
    els.console.scrollTop = els.console.scrollHeight;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function setStatus(text, state) { els.status.textContent = text; if (state) document.body.dataset.state = state; }
  function pyStr(s) { return '"' + s.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"'; }

  // ---------- Python 쪽과 주고받기 ----------
  function snapshot(freshIndex = -1) {
    const proxy = todo.todos;
    const items = proxy.toJs({ dict_converter: Object.fromEntries });
    proxy.destroy();
    items.forEach((it, i) => { it.fresh = i === freshIndex; });
    const total = items.length, done = items.filter((it) => it.done).length;
    return { items, summary: todo.summary(), percent: total ? Math.floor(done * 100 / total) : 0 };
  }
  function save(items) { try { localStorage.setItem("todos", JSON.stringify(items.map(({ title, done }) => ({ title, done })))); } catch (_) {} }
  function refresh(freshIndex) { const snap = snapshot(freshIndex); render(snap); save(snap.items); }

  function run(call, fn, freshIndex) {
    const result = fn();
    logCall(call, result);
    refresh(freshIndex);
    return result;
  }

  els.form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = els.input.value;
    const before = todo.todos.length;
    run(`add_todo(${pyStr(text)})`, () => todo.add_todo(text), before);
    if (todo.todos.length > before) els.input.value = "";
    els.input.focus();
  });
  els.list.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const n = Number(btn.dataset.n);
    if (btn.dataset.act === "done") run(`complete_todo(${n})`, () => todo.complete_todo(n));
    else run(`delete_todo(${n})`, () => todo.delete_todo(n));
  });
  els.clear.addEventListener("click", () => run("clear_done()", () => todo.clear_done()));

  async function boot() {
    try {
      const pyodide = await loadPyodide();
      const src = await (await fetch("todo.py")).text();
      pyodide.FS.writeFile("todo.py", src);
      todo = pyodide.pyimport("todo");         // __name__ 이 "todo" 라서 main() 은 실행되지 않음
      const pyver = pyodide.runPython("import sys\nsys.version.split()[0]");

      // 지난번에 적어 둔 할 일 복원 — 같은 함수를 그대로 호출
      let saved = [];
      try { saved = JSON.parse(localStorage.getItem("todos") || "[]"); } catch (_) {}
      saved.forEach((it, i) => { todo.add_todo(it.title); if (it.done) todo.complete_todo(i + 1); });

      els.input.disabled = els.add.disabled = false;
      setStatus(`Python ${pyver} 실행 중`, "ready");
      logCall("summary()", todo.summary());
      refresh();
      els.input.focus();
    } catch (err) {
      console.error(err);
      setStatus("Python을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.", "error");
      els.summary.textContent = "문제가 생겼습니다.";
    }
  }
  boot();
</script>
</body>
</html>
